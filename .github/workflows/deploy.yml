name: Simple POC Deployment

on:
  push:
    branches:
      - wg
      - steven
      - main

env:
  AWS_REGION: ap-southeast-4
  ECR_REGISTRY: 119778517641.dkr.ecr.ap-southeast-4.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC
      contents: read    # Required for checkout
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Determine environment based on branch
      - name: Set environment variables
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          
          case $BRANCH_NAME in
            wg)
              ENV_NAME=wg
              echo "EC2_HOST=3.x.x.1" >> $GITHUB_ENV
              echo "EIP_ALLOC=eipalloc-wg-xxxxx" >> $GITHUB_ENV
              echo "INSTANCE_ID=i-wg-xxxxx" >> $GITHUB_ENV
              ;;
            steven)
              ENV_NAME=steven
              echo "EC2_HOST=3.x.x.2" >> $GITHUB_ENV
              echo "EIP_ALLOC=eipalloc-steven-xxxxx" >> $GITHUB_ENV
              echo "INSTANCE_ID=i-steven-xxxxx" >> $GITHUB_ENV
              ;;
            main)
              ENV_NAME=prod
              echo "EC2_HOST=3.x.x.3" >> $GITHUB_ENV
              echo "EIP_ALLOC=eipalloc-prod-xxxxx" >> $GITHUB_ENV
              echo "INSTANCE_ID=i-prod-xxxxx" >> $GITHUB_ENV
              ;;
          esac
          
          echo "ENV_NAME=$ENV_NAME" >> $GITHUB_ENV
          echo "BUILD_TIME=$(TZ='Australia/Melbourne' date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_ENV
          echo "ECR_REPO=simple-poc-$ENV_NAME" >> $GITHUB_ENV
      
      # Step 3: Configure AWS credentials (OIDC)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::119778517641:role/GitHubActionsDeployRole
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      
      # Step 4: Login to Amazon ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
      
      # Step 5: Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            --build-arg ENV_NAME=${{ env.ENV_NAME }} \
            --build-arg BUILD_TIME="${{ env.BUILD_TIME }}" \
            -t ${{ env.ECR_REPO }}:latest \
            -t ${{ env.ECR_REPO }}:${{ github.sha }} \
            .
      
      # Step 6: Tag and push to ECR
      - name: Push to ECR
        run: |
          docker tag ${{ env.ECR_REPO }}:latest \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
          
          docker tag ${{ env.ECR_REPO }}:latest \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
          
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
      
      # Step 7: Get EC2 Instance ID by tag
      - name: Get EC2 Instance ID
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=nebulas-dev" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV
          echo "Found instance: $INSTANCE_ID"
      
      # Step 8: Wait for Docker to be ready on EC2 (init script may still be running)
      - name: Wait for Docker ready
        run: |
          echo "Checking if Docker is ready on EC2..."
          for i in $(seq 1 12); do
            CMD_ID=$(aws ssm send-command \
              --instance-ids ${{ env.INSTANCE_ID }} \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["docker info > /dev/null 2>&1 && echo DOCKER_READY"]' \
              --region ${{ env.AWS_REGION }} \
              --query "Command.CommandId" \
              --output text)
            sleep 15
            OUTPUT=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id ${{ env.INSTANCE_ID }} \
              --region ${{ env.AWS_REGION }} \
              --query "StandardOutputContent" --output text 2>/dev/null || echo "")
            if echo "$OUTPUT" | grep -q "DOCKER_READY"; then
              echo "✅ Docker is ready (attempt $i)"
              break
            fi
            echo "Attempt $i: Docker not ready yet, waiting 15s..."
            if [ "$i" = "12" ]; then
              echo "❌ Docker not ready after 3 minutes"
              exit 1
            fi
          done

      # Step 9: Deploy to EC2 via SSM (wait for command to complete)
      - name: Deploy to EC2 via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids ${{ env.INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}",
              "docker stop simple-poc || true",
              "docker rm simple-poc || true",
              "docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest",
              "docker run -d --name simple-poc -p 80:80 --restart unless-stopped ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest",
              "docker image prune -f"
            ]' \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $CMD_ID"

          # Wait for SSM command to complete (max 3 minutes)
          for i in $(seq 1 18); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id ${{ env.INSTANCE_ID }} \
              --region ${{ env.AWS_REGION }} \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: SSM status = $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "✅ SSM command completed successfully"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ SSM command failed with status: $STATUS"
              # Show error details
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id ${{ env.INSTANCE_ID }} \
                --region ${{ env.AWS_REGION }} \
                --query "[StandardOutputContent, StandardErrorContent]" --output text
              exit 1
            fi
            sleep 10
          done

      # Step 10: Verify container is running via SSM (before exposing via EIP)
      - name: Verify container health via SSM
        run: |
          # Check container status and health with diagnostics
          CMD_ID=$(aws ssm send-command \
            --instance-ids ${{ env.INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo === Docker containers ===",
              "docker ps -a",
              "echo === Container logs ===",
              "docker logs simple-poc 2>&1 | tail -20 || true",
              "echo === Health check ===",
              "curl -sf http://localhost/ || echo HEALTH_CHECK_FAILED"
            ]' \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          sleep 20
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id ${{ env.INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }} \
            --query "Status" --output text)

          # Always show output for debugging
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id ${{ env.INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }} \
            --query "StandardOutputContent" --output text)
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "HEALTH_CHECK_FAILED"; then
            echo "❌ Container health check failed"
            exit 1
          elif [ "$STATUS" != "Success" ]; then
            echo "❌ SSM command failed (status: $STATUS)"
            exit 1
          else
            echo "✅ Container is healthy on EC2"
          fi

      # Step 11: Get EIP Allocation ID
      - name: Get EIP Allocation ID
        run: |
          EIP_ALLOC=$(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=nebulas-dev-eip" \
            --query "Addresses[0].AllocationId" \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "EIP_ALLOC=$EIP_ALLOC" >> $GITHUB_ENV
          echo "Found EIP allocation: $EIP_ALLOC"

      # Step 12: Associate Elastic IP (only after container is verified healthy)
      - name: Associate Elastic IP
        run: |
          aws ec2 associate-address \
            --instance-id ${{ env.INSTANCE_ID }} \
            --allocation-id ${{ env.EIP_ALLOC }} \
            --allow-reassociation \
            --region ${{ env.AWS_REGION }}

          EIP=$(aws ec2 describe-addresses \
            --allocation-ids ${{ env.EIP_ALLOC }} \
            --query "Addresses[0].PublicIp" \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "EC2_HOST=$EIP" >> $GITHUB_ENV
          echo "Associated EIP: $EIP"

      # Step 13: Final HTTP verify via public EIP
      - name: Verify deployment via public IP
        run: |
          echo "Testing HTTP endpoint at ${{ env.EC2_HOST }}..."
          RESPONSE=$(curl -sf --retry 5 --retry-delay 5 http://${{ env.EC2_HOST }}/ || echo "failed")

          if echo "$RESPONSE" | grep -q "${{ env.ENV_NAME }}"; then
            echo "✅ Deployment successful!"
            echo "Response: $RESPONSE"
          else
            echo "❌ Deployment verification failed!"
            echo "Response: $RESPONSE"
            exit 1
          fi